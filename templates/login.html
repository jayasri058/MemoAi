<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to MemoAI - Access your AI-powered second brain">
    <title>Login - MemoAI</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <div id="toast-container" class="toast-container"></div>
    <div class="auth-page">
        <div class="auth-wrapper">
            <a href="/" class="auth-back">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12" />
                    <polyline points="12 19 5 12 12 5" />
                </svg>
                Back to Home
            </a>
            <div class="auth-card">
                <div class="auth-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a9 9 0 0 1 9 9c0 3.1-1.6 5.8-4 7.4V21H7v-2.6A9 9 0 0 1 12 2z" />
                        <path d="M9 21v1a3 3 0 0 0 6 0v-1" />
                        <path d="M10 8h4" />
                        <path d="M10 12h4" />
                    </svg>
                    <span class="gradient-text">MemoAI</span>
                </div>
                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Sign in to access your memories</p>

                <!-- Google Sign In -->
                <button id="google-login-btn" class="google-btn" type="button">
                    <svg viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Continue with Google
                </button>

                <div class="auth-divider">
                    <div class="auth-divider-inner"><span>Or continue with email</span></div>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <div class="input-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                <polyline points="22,6 12,13 2,6" />
                            </svg>
                            <input type="email" id="login-email" placeholder="you@example.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                            <input type="password" id="login-password" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <label><input type="checkbox"> <span>Remember me</span></label>
                        <a href="#">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn-primary auth-submit" id="login-submit-btn">Sign In</button>
                </form>

                <p class="auth-footer">Don't have an account? <a href="/register">Sign up</a></p>
            </div>
            <div class="auth-info blue">
                <strong>Demo:</strong> Use any email and password to try the app
            </div>
        </div>
    </div>

    <!-- Google Account Selector Modal -->
    <div id="google-account-modal" class="modal-overlay">
        <div class="modal-box" style="max-width:28rem">
            <div class="modal-header" style="border-radius:1rem 1rem 0 0">
                <div>
                    <h2 style="font-size:1.25rem">Choose an Account</h2>
                    <p style="font-size:.875rem">Sign in to MemoAI</p>
                </div>
                <button class="modal-close" id="close-google-modal"><svg xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg></button>
            </div>
            <div class="modal-body" id="google-accounts-list" style="padding:1rem">
                <p style="text-align:center;color:var(--gray-500)">Loading accounts...</p>
            </div>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
    <script>
        // Login form
        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('login-submit-btn');
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            btn.disabled = true; btn.textContent = 'Signing in...';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    sessionStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('hasVisited', 'true');
                    showToast('Login successful!', 'success');
                    setTimeout(() => window.location.href = '/', 500);
                } else {
                    showToast(data.error || 'Invalid credentials', 'error');
                }
            } catch (err) { showToast('Connection error', 'error'); }
            finally { btn.disabled = false; btn.textContent = 'Sign In'; }
        });

        // Google login
        document.getElementById('google-login-btn').addEventListener('click', async function () {
            const modal = document.getElementById('google-account-modal');
            const list = document.getElementById('google-accounts-list');
            modal.classList.add('active');
            list.innerHTML = '<p style="text-align:center;color:var(--gray-500)">Loading accounts...</p>';
            try {
                const res = await fetch('/api/auth/google/accounts');
                const data = await res.json();
                if (data.accounts && data.accounts.length > 0) {
                    list.innerHTML = data.accounts.map(acc => `
                        <button onclick="selectGoogleAccount('${acc.email}')" style="width:100%;padding:.75rem 1rem;border:1px solid var(--gray-200);border-radius:.5rem;background:#fff;display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem;cursor:pointer;transition:background .15s">
                            <div class="dash-avatar" style="width:2.5rem;height:2.5rem;font-size:.9rem">${acc.name.charAt(0)}</div>
                            <div style="text-align:left"><div style="font-weight:500;font-size:.9rem">${acc.name}</div><div style="font-size:.8rem;color:var(--gray-500)">${acc.email}</div></div>
                        </button>
                    `).join('');
                } else { list.innerHTML = '<p style="text-align:center;color:var(--gray-500)">No accounts found</p>'; }
            } catch (err) { list.innerHTML = '<p style="text-align:center;color:var(--red-500)">Error loading accounts</p>'; }
        });

        document.getElementById('close-google-modal').addEventListener('click', () => {
            document.getElementById('google-account-modal').classList.remove('active');
        });

        async function selectGoogleAccount(email) {
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (res.ok) {
                    sessionStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('hasVisited', 'true');
                    showToast(data.message, 'success');
                    setTimeout(() => window.location.href = '/', 500);
                } else { showToast(data.error, 'error'); }
            } catch (err) { showToast('Connection error', 'error'); }
            document.getElementById('google-account-modal').classList.remove('active');
        }
    </script>
</body>

</html>
