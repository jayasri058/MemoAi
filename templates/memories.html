<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MemoAI - All Memories">
    <title>All Memories - MemoAI</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script>
        const user = JSON.parse(sessionStorage.getItem('user') || 'null');
        if (!user) { window.location.href = '/login'; }
    </script>
</head>

<body>
    <div id="toast-container" class="toast-container"></div>
    <div class="dashboard-page">
        <header class="dash-header">
            <div class="dash-header-inner">
                <a href="/" class="auth-back" style="margin-bottom:0">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                        <line x1="19" y1="12" x2="5" y2="12" />
                        <polyline points="12 19 5 12 12 5" />
                    </svg>
                    Back to Dashboard
                </a>
                <a href="/" class="nav-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a9 9 0 0 1 9 9c0 3.1-1.6 5.8-4 7.4V21H7v-2.6A9 9 0 0 1 12 2z" />
                        <path d="M9 21v1a3 3 0 0 0 6 0v-1" />
                        <path d="M10 8h4" />
                        <path d="M10 12h4" />
                    </svg>
                    <span class="gradient-text">MemoAI</span>
                </a>
                <div class="dash-user">
                    <div class="dash-avatar" id="user-avatar-mem"></div>
                </div>
            </div>
        </header>

        <main class="dash-main">
            <div class="memories-page-header">
                <h1>All Memories</h1>
                <p id="memory-count-text">Loading...</p>
            </div>

            <!-- Filters -->
            <div class="filters-card">
                <div class="search-row">
                    <div class="search-input-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        <input type="text" id="mem-search"
                            placeholder="Search memories by content, tags, or keywords...">
                    </div>
                    <button class="btn-primary" id="search-btn">Search</button>
                </div>
                <div class="filter-row">
                    <div class="filter-group">
                        <label>Category</label>
                        <div class="input-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
                            </svg>
                            <select id="mem-category">
                                <option value="all">All</option>
                                <option value="daily life">Daily Life</option>
                                <option value="work & meetings">Work & Meetings</option>
                                <option value="learning & growth">Learning & Growth</option>
                                <option value="health & fitness">Health & Fitness</option>
                                <option value="money & shopping">Money & Shopping</option>
                                <option value="entertainment">Entertainment</option>
                                <option value="ideas & creativity">Ideas & Creativity</option>
                                <option value="general">General</option>
                            </select>
                        </div>
                    </div>
                    <div class="filter-group">
                        <label>Sort By</label>
                        <div class="input-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                                <line x1="16" y1="2" x2="16" y2="6" />
                                <line x1="8" y1="2" x2="8" y2="6" />
                                <line x1="3" y1="10" x2="21" y2="10" />
                            </svg>
                            <select id="mem-sort">
                                <option value="newest">Newest First</option>
                                <option value="oldest">Oldest First</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="summary-divider">
                    <button class="summary-btn" id="summary-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M12 3l1.9 5.8h6.1l-5 3.6 1.9 5.8L12 14.6l-5 3.6 1.9-5.8-5-3.6h6.1z" />
                        </svg>
                        Generate AI Summary
                    </button>
                </div>
            </div>

            <div id="search-result-info" class="search-result-count" style="display:none"></div>

            <div class="memory-list" id="memories-list">
                <div class="empty-state">
                    <div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg></div>
                    <h3>Loading memories...</h3>
                    <p>Please wait</p>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/script.js"></script>
    <script>
        (function () {
            const user = getCurrentUser();
            if (!user) return;
            document.getElementById('user-avatar-mem').textContent = user.name.charAt(0);
            let allMemories = [];

            async function loadAll() {
                try {
                    const res = await fetch('/api/search-memories?q=*', { headers: { 'X-User-Id': user.id } });
                    const data = await res.json();
                    allMemories = data.results || [];
                    document.getElementById('memory-count-text').textContent =
                        allMemories.length + (allMemories.length === 1 ? ' memory' : ' memories') + ' stored';
                    renderAll();
                } catch (e) { console.error(e); }
            }

            function renderAll() {
                const query = (document.getElementById('mem-search').value || '').toLowerCase();
                const cat = document.getElementById('mem-category').value;
                const sort = document.getElementById('mem-sort').value;

                let filtered = allMemories.filter(m => {
                    const matchQ = !query ||
                        (m.title || '').toLowerCase().includes(query) ||
                        (m.content || '').toLowerCase().includes(query) ||
                        ((m.tags || []).join(' ')).toLowerCase().includes(query);
                    const matchC = cat === 'all' || (m.category || '').toLowerCase() === cat;
                    return matchQ && matchC;
                });

                filtered.sort((a, b) => {
                    const da = new Date(a.created_at || a.timestamp || 0).getTime();
                    const db = new Date(b.created_at || b.timestamp || 0).getTime();
                    return sort === 'newest' ? db - da : da - db;
                });

                const infoEl = document.getElementById('search-result-info');
                if (query) {
                    infoEl.style.display = 'block';
                    infoEl.innerHTML = `Found <span>${filtered.length}</span> result${filtered.length !== 1 ? 's' : ''} for "${query}"`;
                } else { infoEl.style.display = 'none'; }

                const list = document.getElementById('memories-list');
                if (filtered.length === 0) {
                    list.innerHTML = `<div class="empty-state" style="background:#fff;border-radius:1rem;box-shadow:var(--shadow-lg);border:1px solid var(--gray-200);padding:3rem">
                    <div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
                    <h3>No memories found</h3>
                    <p style="margin-bottom:1.5rem">${query ? 'Try adjusting your search terms or filters' : 'Start capturing your thoughts to see them here'}</p>
                    <a href="/" class="btn-primary">Create Your First Memory</a>
                </div>`;
                } else {
                    list.innerHTML = filtered.map(renderMemoryCard).join('');
                }
            }

            document.getElementById('mem-search').addEventListener('input', renderAll);
            document.getElementById('mem-category').addEventListener('change', renderAll);
            document.getElementById('mem-sort').addEventListener('change', renderAll);
            document.getElementById('search-btn').addEventListener('click', () => {
                const q = document.getElementById('mem-search').value.trim();
                if (!q) { showToast('Please enter a search query', 'info'); return; }
                renderAll();
                showToast(`Found results`, 'success');
            });

            document.getElementById('summary-btn').addEventListener('click', async () => {
                const btn = document.getElementById('summary-btn');
                btn.disabled = true; btn.innerHTML = '<span class="processing-spinner"></span> Generating...';
                try {
                    const res = await fetch('/api/memories/summary', { headers: { 'X-User-Id': user.id } });
                    const data = await res.json();
                    showToast(data.summary || 'No summary available', 'success');
                } catch (e) { showToast('Failed to generate summary', 'error'); }
                finally { btn.disabled = false; btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.8h6.1l-5 3.6 1.9 5.8L12 14.6l-5 3.6 1.9-5.8-5-3.6h6.1z"/></svg> Generate AI Summary'; }
            });

            loadAll();
        })();
    </script>
</body>

</html>
